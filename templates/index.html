<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>{{name}} · {{org}}</title>
  <meta name="description" content="Biglietto da visita di {{name}}, {{role}} · {{org}}">
  <meta property="og:title" content="{{name}} · {{org}}">
  <meta property="og:description" content="{{role}}">
  <link rel="icon" href="../brand/secap-mark.svg" type="image/svg+xml">
  <link rel="preload" href="../fonts/Manrope-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="../fonts/Manrope-SemiBold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    /* Variante A del confronto VC15 (9 ottobre 2026): il linguaggio di
       SECAP PRO. I valori vengono dai token del design system di SECAP PRO
       (design-system/tokens/foundations.tokens.json); il blu solo per l'azione.
       Solo tema chiaro, sfondo bianco (Enrico, 09/10/2026). */
    @font-face { font-family: "Manrope"; src: url("../fonts/Manrope-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Manrope"; src: url("../fonts/Manrope-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "Manrope"; src: url("../fonts/Manrope-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }

    :root {
      --bg: #ffffff;              /* surface-canvas */
      --ink: #0f0f0f;             /* text-primary */
      --soft: #464646;            /* text-secondary */
      --meta: #5f6368;            /* text-meta */
      --line: #ededed;            /* border-subtle */
      --ring: #d9d9d9;            /* border-default */
      --mono-bg: #f5f5f5;         /* surface-subtle */
      --row-hover: #eef3ff;       /* action-soft */
      --cta: #1646bc;             /* action-active, brand-600 */
      --cta-pressed: #0f3596;     /* action-pressed, brand-700 */
      --cta-text: #ffffff;        /* text-on-action */
      --focus: #1646bc;
      --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 24px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding: 32px 24px 24px;
    }

    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .top a { display: inline-flex; border-radius: 6px; }
    .logo { height: 24px; width: auto; display: block; }
    .top span { color: var(--meta); font-size: 13px; line-height: 18px; font-weight: 500; }

    .identity { display: grid; justify-items: center; text-align: center; gap: 8px; }
    .photo {
      width: 128px; height: 128px; border-radius: 50%;
      object-fit: cover; margin-bottom: 12px;
      box-shadow: 0 0 0 1px var(--ring);
      background: var(--mono-bg);
    }
    .photo--mono {
      display: grid; place-items: center;
      color: var(--ink); font-size: 40px; font-weight: 600; letter-spacing: -.02em;
    }
    h1 { margin: 0; font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -.03em; }
    .role { margin: 0; color: var(--soft); }

    .save {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 56px; border-radius: 999px;
      background: var(--cta); color: var(--cta-text);
      font-size: 17px; font-weight: 600; text-decoration: none;
      transition: background-color .12s ease;
    }
    .save:hover, .save:active { background: var(--cta-pressed); }
    .save svg { width: 20px; height: 20px; }

    .rows { display: grid; }
    .row {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
      padding: 16px 12px; margin: 0 -12px;
      border-top: 1px solid var(--line);
      color: var(--ink); text-decoration: none;
      transition: background-color .12s ease;
    }
    .row:last-child { border-bottom: 1px solid var(--line); }
    .row:hover, .row:active { background: var(--row-hover); border-radius: 16px; }
    .row small { display: block; color: var(--meta); font-size: 13px; line-height: 18px; font-weight: 500; }
    .row .val { display: block; word-break: break-word; }
    .row svg { width: 18px; height: 18px; color: var(--meta); }

    footer {
      margin-top: auto; padding-top: 8px;
      display: grid; justify-items: center; gap: 4px; text-align: center;
      color: var(--meta); font-size: 13px; line-height: 18px;
    }
    footer b { color: var(--ink); font-size: 15px; font-weight: 500; }

    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .save:focus-visible, .row:focus-visible { border-radius: 16px; }
    .save:focus-visible { border-radius: 999px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <a href="{{brandSite}}" target="_blank" rel="noopener" aria-label="{{brandName}}, sito">
        <img class="logo" src="../brand/secap-logo.svg" alt="SECAP" width="97" height="24">
      </a>
      <span>Biglietto da visita</span>
    </header>

    <section class="identity">
      {{portrait}}
      <h1>{{name}}</h1>
      <p class="role">{{role}}<br>{{org}}</p>
    </section>

    <a class="save" href="card.vcf" download="{{slug}}.vcf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Salva contatto
    </a>

    <nav class="rows" aria-label="Contatti">
{{contactRows}}
    </nav>

    <footer><b>{{motto}}</b>{{org}}</footer>
  </main>
</body>
</html>
